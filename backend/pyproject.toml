[project]
name = "custode-backend"
version = "0.0.0"
description = "Custode backend — FastAPI modular monolith"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "redis>=5.2",
    "taskiq>=0.11.7",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "uuid-utils>=0.10",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "webauthn>=2.8.0",
    "aiosmtplib>=3.0",
    "recipe-scrapers>=15.11.0",
    "defusedxml>=0.7",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "hypothesis>=6.119",
    "pip-audit>=2.7",
    "testcontainers[postgres]>=4.8",
    "soft-webauthn>=0.1.3",
    "types-python-dateutil>=2.9",
    "pyyaml>=6.0",                                  # tests/test_compose_env.py parst die Compose-Dateien
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Linting / typing / tests
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E402"]   # asserts, test creds, importorskip
"app/scripts/**" = ["S101"]
"migrations/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``-ra`` ist kein Geschmack: mit dem blossen ``-q`` druckte ein Lauf ohne Docker
# ``563 skipped, 374 passed`` und keinen einzigen Grund. Wer nicht sieht, WARUM etwas
# uebersprungen wurde, sieht auch nicht, DASS die Abdeckung fehlt (Gate in tests/conftest.py).
addopts = "-q -ra --strict-markers"

# ---------------------------------------------------------------------------
# Module boundaries (CLAUDE.md / ARCHITECTURE §4) — CI gate `lint-imports`
# In Phase 0 modules/ is empty; the per-module independence contract is added
# in Phase 1 when modules exist. The forbidden contracts below already hold.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel must not depend on modules or adapters"
type = "forbidden"
source_modules = ["app.kernel"]
forbidden_modules = ["app.modules", "app.adapters"]

[[tool.importlinter.contracts]]
name = "adapters must not depend on modules"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "modules must not depend on adapters (use ports via DI)"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.adapters"]

# Cross-module only via the public api.py (CLAUDE.md): recipes may call nutrition.api, never its
# internals; nutrition never depends on recipes (the dependency is one-way recipes -> nutrition).
[[tool.importlinter.contracts]]
name = "recipes uses only nutrition's public api"
type = "forbidden"
source_modules = ["app.modules.recipes"]
# Only DIRECT imports are forbidden — recipes -> nutrition.api (which itself pulls nutrition.service)
# is the intended path; a direct recipes -> nutrition.service would be flagged.
allow_indirect_imports = true
forbidden_modules = [
    "app.modules.nutrition.service",
    "app.modules.nutrition.models",
    "app.modules.nutrition.router",
    "app.modules.nutrition.schemas",
]

[[tool.importlinter.contracts]]
name = "nutrition must not depend on recipes"
type = "forbidden"
source_modules = ["app.modules.nutrition"]
forbidden_modules = ["app.modules.recipes"]

# tasks (P4-S1) imports only kernel/* and economy's PUBLIC api (economy.api) to credit the points
# ledger on completion (ADR-0035) — never economy internals nor any other module.
[[tool.importlinter.contracts]]
name = "tasks uses only economy's public api"
type = "forbidden"
source_modules = ["app.modules.tasks"]
# economy.api -> economy.service is the intended path; a direct tasks -> economy.service is flagged.
allow_indirect_imports = true
forbidden_modules = [
    "app.modules.accounts",
    "app.modules.recipes",
    "app.modules.nutrition",
    "app.modules.shopping",
    "app.modules.marketplace",
    "app.modules.economy.service",
    "app.modules.economy.models",
    "app.modules.economy.router",
    "app.modules.economy.schemas",
]

# economy (P4-S2) owns the points ledger; it imports only kernel/* and never another feature module
# (the dependency is strictly one-way: tasks/marketplace/… -> economy.api).
[[tool.importlinter.contracts]]
name = "economy must not depend on other modules"
type = "forbidden"
source_modules = ["app.modules.economy"]
forbidden_modules = [
    "app.modules.accounts",
