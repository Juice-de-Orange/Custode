name: Question
description: Ask how something works, how to set it up, or whether Custode fits your use.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/Juice-de-Orange/Custode#readme) and the
        [operations guide](https://github.com/Juice-de-Orange/Custode/blob/main/docs/operations.md)
        first. Remove passwords, tokens, e-mail addresses and host names from anything you paste.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you are trying to do, and how you run Custode (quick start, server behind a proxy, version or image tag).
