name: release

# Publishes the container images when a version tag (v1.2.3) is pushed:
#   ghcr.io/juice-de-orange/custode-api   api, worker, scheduler, migrations (backend/)
#   ghcr.io/juice-de-orange/custode-web   the PWA served by Caddy (web/)
# for linux/amd64 and linux/arm64, tagged <version>, <major>.<minor> and latest (latest only for a
# release without a pre-release suffix). docker-compose.prod.yml pulls them; `build:` stays as the
# fallback for anyone who builds from source.
#
# Runs only on tags in this repository: a fork that pushes the same tag skips the job (owner guard),
# pull requests never trigger it, and `packages: write` exists in this one job only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: image (${{ matrix.image }})
    if: github.repository == 'Juice-de-Orange/Custode'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: custode-api
            context: backend
            description: Custode API, worker, scheduler and migrations (FastAPI, taskiq, Alembic)
          - image: custode-web
            context: web
            description: Custode web app (React PWA served by Caddy)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/juice-de-orange/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
